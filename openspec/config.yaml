schema: spec-driven

# Конфиг общий для всех частей монорепо Мигома.

context: |
  Все артефакты (proposal, specs, design, tasks) пиши на русском языке и коротко:
  это хакатон, важна скорость. Заголовки и ключевые слова формата OpenSpec оставляй как есть:
  Purpose, Requirements, Requirement, Scenario, ADDED/MODIFIED/REMOVED, WHEN/THEN, SHALL/MUST.
  Имена в коде, файлах и capability - на английском, комментарии в коде - на русском.
  Интерфейс пользователя на русском языке.

  Мигом - агрегатор доставки еды. Части репозитория:
  - backend/business_service - Python, FastAPI: пользователи, вход, компании, точки, каталог;
  - backend/delivery_service - Python, FastAPI: корзина, заказы, курьеры, смены, предложения заказа курьеру;
  - backend/realtime_service - Go: WebSocket-хаб, читает события Kafka;
  - frontend/owner_web, frontend/moderator_web - React, Vite, MUI;
  - mobile/customer_app, mobile/courier_app - Flutter;
  - infra - docker compose и nginx.
  Оба Python-сервиса работают с одной базой PostgreSQL `migom`.

  Перед подготовкой артефактов прочитай README.md в корне и README затронутой части.

  Мигом интегрируется с Goden (учёт остатков, сроков годности и стоп-листа ресторана,
  репозиторий C:\VS_code\Goden): вход через Keycloak Goden, наличие блюд и заказы на кухню
  через API Goden. План и места в коде - docs/goden-integration.md, контракт Goden -
  backend/api/openapi.yaml в его репозитории. Если change требует правки в Goden,
  назови её в proposal отдельно: она делается в репозитории Goden по его правилам.

  Не выдавай предположение за решение. Если от неясного поведения зависят specs,
  подход или задачи, спроси пользователя до того, как писать эти артефакты.
  Мелкую деталь или факт, на который сейчас никто не ответит, запиши как допущение.

  Утверждение о существующем коде, на котором строится артефакт, сначала проверь
  по реализации и местам использования. Непроверенное называй гипотезой и не строй
  на нём решений.

rules:
  proposal:
    - В scope только то, что следует из запроса, docs/goden-integration.md, существующих specs или кода.
    - В конце What Changes после «Вне изменения:» перечисли, что сознательно не делаем.
    - В Impact назови затронутые части репо. Изменение API сервиса отметь как затрагивающее его клиентов (веб и мобильные приложения), правку в Goden - отдельной строкой.
    - Отдельный раздел критериев приёмки не пиши, их роль играют сценарии specs.
  specs:
    - Только наблюдаемое поведение и инварианты, без реализации, псевдокода, кода и тестов.
    - Для нового поведения покрой основной сценарий и, где применимо, границы, пустое состояние, ошибку и повтор. Невозможные в доменной модели edge case ради полноты не добавляй.
    - Не придумывай молча поведение, которого не задали пользователь, docs/goden-integration.md или существующие specs.
  design:
    - Только решения, которые заметно влияют на реализацию, поддержку или тесты. Требования из specs не повторяй.
    - Если были реальные альтернативы, коротко объясни выбор. Решение, выведенное из кода или конвенций, а не заданное пользователем, так и подпиши.
    - Риски (гонки, частичный сбой, совместимость, производительность) разбирай только там, где они реальны. Для вызовов Goden разбери недоступность Goden и повтор запроса.
  tasks:
    - В начале tasks.md укажи часть репо и папку, из которой запускаются команды. Если части разные, укажи часть у каждой задачи.
    - Каждая задача заканчивается словами «проверка:» и проверкой по её содержанию. Код проверяй тестами затронутого кода и быстрой проверкой сборки или типов, остальное командой, поиском по коду или скриншотом. В документации проверь, что упомянутые пути и команды существуют.
    - Новый тест пиши, только если он ловит новое поведение или новое сочетание изменения с существующим.
    - Каждая задача ведёт к требованию specs или решению design. Edge case проверяй в основной задаче, отдельная задача нужна, только если он требует отдельной реализации.
    - В tasks только то, что агент делает и проверяет сам. Проверки, которые может сделать только человек (реальное устройство, сверка на глаз, внешний сервис), задачами не оформляй, агент выдаст их после apply в «Что проверить вручную».

operations:
  apply:
    guidance:
      - Выполняй только задачи из текущих артефактов change, не расширяй scope.
      - Если задачу нельзя выполнить однозначно из-за противоречия или отсутствующего требования, не придумывай продуктовое поведение, а сообщи о проблеме до реализации затронутой части.
      - Если реализация требует отступить от specs или design, сначала явно назови это отступление.
      - После выполнения выдай раздел «## Что проверить вручную» с пунктами MUST и SHOULD.
