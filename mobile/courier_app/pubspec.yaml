name: courier_app
description: "Delivery aggregator courier app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  dio: ^5.7.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Secure storage for JWT
  flutter_secure_storage: ^9.2.2

  # WebSocket
  web_socket_channel: ^3.0.1

  # Maps
  yandex_mapkit: ^4.2.1

  # Geolocation
  geolocator: ^13.0.2

  # Images
  cached_network_image: ^3.4.1

  # Fonts
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8
  audioplayers: ^6.6.0
  intl: ^0.19.0
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.1

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
