<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<title>Migom - Титульный слайд</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@600;700;800&display=swap"
			rel="stylesheet"
		/>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			.slide {
				width: 1920px;
				height: 1080px;
				overflow: hidden;
				position: relative;
				background: #0f1117;
				font-family: 'Inter', sans-serif;
				color: #fff;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			.bg-circle {
				position: absolute;
				border-radius: 50%;
				filter: blur(100px);
				pointer-events: none;
			}
			.bg-c1 {
				width: 700px;
				height: 700px;
				top: -120px;
				left: -100px;
				background: #4ade80;
				opacity: 0.08;
			}
			.bg-c2 {
				width: 900px;
				height: 900px;
				bottom: -200px;
				right: -180px;
				background: #4ade80;
				opacity: 0.05;
			}
			.bg-c3 {
				width: 400px;
				height: 400px;
				top: 50%;
				left: 55%;
				transform: translate(-50%, -50%);
				background: #34d399;
				opacity: 0.06;
			}
			.grid-pattern {
				position: absolute;
				inset: 0;
				background-image:
					linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
					linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
				background-size: 60px 60px;
				pointer-events: none;
			}
			.content {
				position: relative;
				z-index: 2;
				text-align: center;
				max-width: 1200px;
			}
			.logo-icon {
				width: 80px;
				height: 80px;
				border-radius: 20px;
				background: #4ade80;
				display: flex;
				align-items: center;
				justify-content: center;
				margin: 0 auto 40px;
				box-shadow: 0 12px 40px rgba(74, 222, 128, 0.35);
				color: #fff;
			}
			.logo-icon svg {
				width: 44px;
				height: 44px;
			}
			h1 {
				font-family: 'Montserrat', sans-serif;
				font-size: 96px;
				font-weight: 800;
				letter-spacing: -3px;
				line-height: 1.2;
				padding-bottom: 4px;
				margin-bottom: 20px;
				background: linear-gradient(135deg, #fff 0%, #4ade80 100%);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				background-clip: text;
			}
			.subtitle {
				font-size: 28px;
				font-weight: 400;
				color: #8896a7;
				margin-bottom: 8px;
				letter-spacing: 0.5px;
			}
			.tagline {
				font-size: 20px;
				color: #4ade80;
				font-weight: 600;
				margin-top: 8px;
			}
			.bottom {
				position: absolute;
				bottom: 60px;
				left: 0;
				right: 0;
				text-align: center;
			}
			.bottom span {
				font-size: 16px;
				color: #8896a7;
				letter-spacing: 1px;
			}
			.badge {
				display: inline-block;
				padding: 8px 24px;
				border: 1px solid rgba(74, 222, 128, 0.25);
				border-radius: 40px;
				color: #4ade80;
				font-size: 14px;
				font-weight: 600;
				letter-spacing: 0.5px;
				margin-top: 12px;
			}
		</style>
	</head>
	<body>
		<div class="slide">
			<div class="bg-circle bg-c1"></div>
			<div class="bg-circle bg-c2"></div>
			<div class="bg-circle bg-c3"></div>
			<div class="grid-pattern"></div>

			<div class="content">
				<div class="logo-icon">
					<!-- Lucide: truck -->
					<svg
						xmlns="http://www.w3.org/2000/svg"
						width="44"
						height="44"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<path
							d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"
						/>
						<path d="M15 18h2" />
						<path
							d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"
						/>
						<circle cx="17" cy="18" r="2" />
						<circle cx="7" cy="18" r="2" />
					</svg>
				</div>
				<h1>Мигом!</h1>
				<div class="subtitle">Агрегатор доставки еды</div>
				<div class="tagline">
					Платформа для заказа еды с умным автоматическим поиском курьеров
				</div>
			</div>

			<div class="bottom">
				<span>Агрегатор для службы доставки</span><br />
				<div class="badge">Хакатон · Спикер: Иван · копим на однушку</div>
			</div>
		</div>
	</body>
</html>
