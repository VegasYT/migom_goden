worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    upstream business_service {
        server business_service:8000;
    }

    upstream delivery_service {
        server delivery_service:8001;
    }

    upstream realtime_service {
        server realtime_service:8080;
    }

    server {
        listen 80;
        server_name _;

        # Заголовки безопасности
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;

        # Ограничение размера тела запроса (для загрузки фото)
        client_max_body_size 10M;

        # Auth - строже rate limit
        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://business_service;
            include /etc/nginx/proxy_params.conf;
        }

        # --- Delivery Service ---
        location /api/v1/orders {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://delivery_service;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/v1/cart {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://delivery_service;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/v1/couriers {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://delivery_service;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/v1/shifts {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://delivery_service;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/v1/customers {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://delivery_service;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/v1/courier/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://delivery_service;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/v1/outlet/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://delivery_service;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/v1/admin/orders {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://delivery_service;
            include /etc/nginx/proxy_params.conf;
        }

        # --- Business Service (всё остальное) ---
        location /api/v1/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://business_service;
            include /etc/nginx/proxy_params.conf;
        }

        # WebSocket - realtime_service
        location /ws {
            proxy_pass http://realtime_service;
            include /etc/nginx/ws_params.conf;
        }

        # Health checks без rate limit
        location /health {
            proxy_pass http://business_service;
            include /etc/nginx/proxy_params.conf;
        }

        location /delivery/health {
            proxy_pass http://delivery_service/health;
            include /etc/nginx/proxy_params.conf;
        }

        location /realtime/health {
            proxy_pass http://realtime_service/health;
            include /etc/nginx/proxy_params.conf;
        }

        # Swagger - business_service
        location /business/ {
            proxy_pass http://business_service/business/;
            include /etc/nginx/proxy_params.conf;
        }

        # Swagger - delivery_service
        location /delivery/ {
            proxy_pass http://delivery_service/delivery/;
            include /etc/nginx/proxy_params.conf;
        }
    }
}
