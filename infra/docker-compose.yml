services:

  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: migom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: migom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "6432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d migom"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: migom_redis
    restart: unless-stopped
    # Ex - keyspace events для истёкших ключей (нужно для оффера курьеру)
    command: redis-server --notify-keyspace-events Ex
    ports:
      - "7379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: migom_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "7000:9000"
      - "7001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: migom_kafka
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "uIVIHZ_jRRKYteGvcHZw3A"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  business_service:
    build:
      context: ../backend/business_service
      dockerfile: Dockerfile
    container_name: migom_business
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../backend/business_service/.env
    # Keycloak Goden работает на хосте (порт 8180): на Linux имя host.docker.internal нужно объявить
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"

  delivery_service:
    build:
      context: ../backend/delivery_service
      dockerfile: Dockerfile
    container_name: migom_delivery
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - ../backend/delivery_service/.env
    # Keycloak Goden работает на хосте (порт 8180): на Linux имя host.docker.internal нужно объявить
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8001"

  realtime_service:
    build:
      context: ../backend/realtime_service
      dockerfile: Dockerfile
    container_name: migom_realtime
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - ../backend/realtime_service/.env
    expose:
      - "8080"

  nginx:
    image: nginx:1.25-alpine
    container_name: migom_nginx
    restart: unless-stopped
    depends_on:
      - business_service
      - delivery_service
      - realtime_service
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./nginx/ws_params.conf:/etc/nginx/ws_params.conf:ro

volumes:
  postgres_data:
  redis_data:
  minio_data:
  kafka_data:


networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.50.0.0/24
          gateway: 10.50.0.1
